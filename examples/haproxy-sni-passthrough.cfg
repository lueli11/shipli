# Modus "hinter bestehendem Proxy" mit HAProxy: eigene Domains bedient HAProxy weiter selbst, alles andere geht
# unverschlüsselt durch (SNI-Passthrough) an Shipli, das seine Zertifikate selbst holt.
# Anpassen: 10.0.80.20 = SHIPLI_INGRESS_IP, example.com = eigene Domains, shipli.example.com = SHIPLI_HOST,
# own_* = die bisherigen Backends. In Shipli SHIPLI_TRUSTED_IPS auf die IP dieses HAProxy setzen.

frontend http-in
    bind :80
    mode http
    use_backend shipli_http if { hdr(host),field(1,:) -i shipli.example.com }
    use_backend own_http if { hdr(host),field(1,:) -m reg -i (^|\.)example\.com$ }
    default_backend shipli_http

frontend https-in
    bind :443
    mode tcp
    tcp-request inspect-delay 5s
    tcp-request content accept if { req_ssl_hello_type 1 }
    use_backend shipli_https if { req_ssl_sni -i shipli.example.com }
    use_backend own_https if { req_ssl_sni -m reg -i (^|\.)example\.com$ }
    default_backend shipli_https

# Echte Client-IP: auf 443 per PROXY-Protokoll v2 vor den TLS-Daten, auf 80 per X-Forwarded-For
backend shipli_https
    mode tcp
    server shipli 10.0.80.20:443 send-proxy-v2

backend shipli_http
    mode http
    option forwardfor
    server shipli 10.0.80.20:80
